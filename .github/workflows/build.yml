name: Build CloudRedir

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Use the devkitpro/switch image – it provides the Switch toolchain pre‑installed
    container:
      image: devkitpro/switch:latest
      # Optional: run as a non‑root user to avoid permission‑related issues with mounted volumes
      options: >-
        --user $(id -u):$(id -g)
        --volume "${{ github.workspace }}:${{ github.workspace }}"
        --workdir "${{ github.workspace }}"
    steps:
      - uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          ls -la $DEVKITPRO
          which aarch64-none-elf-gcc
          aarch64-none-elf-gcc --version | head -1

      - name: Build sysmodule
        working-directory: sysmodule
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/switch_rules/share/switch.cmake
          make

      - name: Build frontend
        working-directory: frontend
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/switch_rules/share/switch.cmake
          make

      - name: Upload sysmodule artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudredir-sysmodule
          path: sysmodule/build/cloudredir.nso

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudredir-frontend
          path: frontend/build/cloudredir.nro