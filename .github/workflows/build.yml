name: Build CloudRedir

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DEVKITPRO: /opt/devkitpro

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PATH: ${{ env.DEVKITPRO }}/devkitA64/bin:${{ env.DEVKITPRO }}/tools/bin:${PATH}
    steps:
      - uses: actions/checkout@v4

      - name: Install devkitPro
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg
          curl -fsSL https://apt.devkitpro.org/install.sh | sudo bash
          sudo apt-get install -y switch-dev switch-tools switch-curl switch-mbedtls

      - name: Verify installation
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          ls -la $DEVKITPRO
          which aarch64-none-elf-gcc
          aarch64-none-elf-gcc --version | head -1

      - name: Build sysmodule
        working-directory: sysmodule
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/switch_rules/share/switch.cmake
          make

      - name: Build frontend
        working-directory: frontend
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/switch_rules/share/switch.cmake
          make

      - name: Upload sysmodule artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudredir-sysmodule
          path: sysmodule/build/cloudredir.nso

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudredir-frontend
          path: frontend/build/cloudredir.nro