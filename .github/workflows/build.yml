name: Build CloudRedir

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/switch:latest   # provides the Switch toolchain pre‑installed
    steps:
      - uses: actions/checkout@v4

      - name: Install build essentials (if missing)
        run: |
          apt-get update && apt-get install -y make cmake git

      - name: Verify toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          ls -la $DEVKITPRO
          which aarch64-none-elf-gcc
          aarch64-none-elf-gcc --version | head -1

      - name: Build sysmodule
        working-directory: sysmodule
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/switch_rules/share/switch.cmake
          make

      - name: Build frontend
        working-directory: frontend
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/switch_rules/share/switch.cmake
          make

      - name: Upload sysmodule artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudredir-sysmodule
          path: sysmodule/build/cloudredir.nso

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudredir-frontend
          path: frontend/build/cloudredir.nro